###############################################################################
# MediaMTX configuration for Aqara camera bridge
# All cameras share ONE public RTSP port (8554).
# The Node.js bridge serves each camera internally on 127.0.0.1:855X.
# An ffmpeg relay process per camera reads the internal stream and pushes here.
###############################################################################

logLevel: info

# ── Network listeners ─────────────────────────────────────────────────────────
rtsp: yes
rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no

# ── Path defaults ─────────────────────────────────────────────────────────────
# ffmpeg relay processes publish to /live/<slug> from localhost.
# MediaMTX accepts any path by default — no per-camera static config needed.
pathDefaults:
  record: no
