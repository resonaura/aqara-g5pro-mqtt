name: Test stream recovery
on:
  pull_request:
    paths: ["app/**", ".github/workflows/test.yaml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DATA_DIR: /tmp/aqara-test-data
      SQLITE_PATH: /tmp/aqara-test-data/storage.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install missing native test tools
        timeout-minutes: 8
        run: |
          packages=()
          command -v ffmpeg >/dev/null || packages+=(ffmpeg)
          command -v cmake >/dev/null || packages+=(cmake)
          command -v c++ >/dev/null || packages+=(build-essential)
          if ((${#packages[@]})); then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y "${packages[@]}"
          fi
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build && pnpm build:native
        working-directory: app
      - run: ctest --test-dir native/build --output-on-failure
        working-directory: app
      - name: Check malformed media under address and undefined-behavior sanitizers
        working-directory: app
        run: |
          c++ -std=c++23 -g -fsanitize=address,undefined -I native/src \
            native/tests/reassembler_test.cpp native/src/crypto/chacha20.cpp \
            native/src/media/reassembler.cpp native/src/p2p/cipher.cpp \
            -o /tmp/aqara-reassembler-sanitized
          /tmp/aqara-reassembler-sanitized
          c++ -std=c++23 -g -fsanitize=address,undefined -pthread -I native/src \
            native/tests/rtsp_writer_test.cpp -o /tmp/aqara-writer-sanitized
          /tmp/aqara-writer-sanitized
          c++ -std=c++23 -g -fsanitize=address,undefined -pthread -DAQARA_SANITIZED_TEST=1 -I native/src \
            native/tests/rtsp_server_test.cpp native/src/rtsp/server.cpp \
            -o /tmp/aqara-rtsp-server-sanitized
          /tmp/aqara-rtsp-server-sanitized
          c++ -std=c++23 -g -O1 -fsanitize=address,undefined -pthread -I native/src -I native/build/_deps/glaze-src/include \
            native/tests/session_lifetime_test.cpp native/src/session.cpp native/src/crypto/chacha20.cpp \
            native/src/media/reassembler.cpp native/src/rtsp/server.cpp -o /tmp/aqara-session-lifetime-sanitized
          /tmp/aqara-session-lifetime-sanitized
          c++ -std=c++23 -g -O1 -fsanitize=address,undefined -pthread -I native/src -I native/build/_deps/glaze-src/include \
            native/tests/p2p_transport_test.cpp native/src/p2p/client.cpp native/src/p2p/cipher.cpp \
            native/src/crypto/chacha20.cpp native/src/media/reassembler.cpp -o /tmp/aqara-p2p-transport-sanitized
          /tmp/aqara-p2p-transport-sanitized
      - run: pnpm test && pnpm lint
        working-directory: app
