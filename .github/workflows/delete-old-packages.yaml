name: Cleanup Old Underscore Packages

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Underscore Packages
        run: |
          for pkg in "aqara_g5_pro%2Famd64" "aqara_g5_pro%2Faarch64"; do
            echo "Attempting to delete package: $pkg"
            res=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/$pkg")
            echo "$res"
          done
